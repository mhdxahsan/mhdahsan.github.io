<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Muhammad Ahsan | Creative Digital Designer</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050507;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

img{
    max-width:100%;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

section{
    padding:100px 0;
}


/* =========================
   BACKGROUND
========================= */

body:before,
body:after{
    content:"";
    position:fixed;
    width:450px;
    height:450px;
    border-radius:50%;
    filter:blur(120px);
    pointer-events:none;
    z-index:-5;
}

body:before{
    background:#5b21b6;
    opacity:.18;
    left:-220px;
    top:100px;
}

body:after{
    background:#00d9ff;
    opacity:.10;
    right:-220px;
    bottom:50px;
}


/* =========================
   LOADER
========================= */

.loader{
    position:fixed;
    inset:0;
    background:#050507;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:99999;
    animation:hideLoader 1s forwards 1.5s;
}

.loader span{
    font-size:45px;
    font-weight:900;
    letter-spacing:5px;
    background:linear-gradient(
        90deg,
        #fff,
        #8b5cf6,
        #00e5ff,
        #fff
    );
    background-size:300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:gradient 2s linear infinite;
}

@keyframes hideLoader{
    to{
        opacity:0;
        visibility:hidden;
    }
}

@keyframes gradient{
    from{background-position:0;}
    to{background-position:300%;}
}


/* =========================
   NAVBAR
========================= */

.navbar{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    width:min(1100px,92%);
    padding:13px 20px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:50px;
    background:rgba(10,10,15,.78);
    backdrop-filter:blur(20px);
    z-index:9999;
}

.nav-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:22px;
    font-weight:900;
}

.logo span{
    color:#8b5cf6;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:4px;
}

.nav-links a{
    padding:9px 12px;
    color:#9999a5;
    font-size:12px;
    border-radius:30px;
    transition:.3s;
}

.nav-links a:hover,
.nav-links a.active{
    color:#fff;
    background:rgba(255,255,255,.07);
}

.menu{
    display:none;
    border:0;
    background:transparent;
    color:#fff;
    font-size:25px;
    cursor:pointer;
}


/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    padding-top:120px;
}

.hero-grid{
    display:grid;
    grid-template-columns:1.1fr .9fr;
    gap:50px;
    align-items:center;
}

.hero-small{
    color:#9999a5;
    text-transform:uppercase;
    letter-spacing:3px;
    font-size:13px;
    margin-bottom:20px;
}

.hero-small:before{
    content:"";
    display:inline-block;
    width:30px;
    height:1px;
    background:#8b5cf6;
    vertical-align:middle;
    margin-right:10px;
}


/* =========================
   NAME
========================= */

.name-area{
    position:relative;
    display:inline-block;
    z-index:10;
    padding:35px 45px;
    margin:-35px -45px;
}

.name{
    position:relative;
    z-index:20;
    font-size:clamp(55px,8vw,100px);
    line-height:.9;
    letter-spacing:-6px;
    font-weight:900;
}

.gradient-name{
    background:linear-gradient(
        90deg,
        #fff,
        #8b5cf6,
        #00e5ff,
        #fff
    );
    background-size:300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:gradient 5s linear infinite;
}


/* =========================
   FIREWORKS
========================= */

.firework{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    z-index:5;
    pointer-events:none;
    animation:fireworkGlow 1.8s infinite;
}

.firework:before{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#fff;
    transform:translate(-50%,-50%);

    box-shadow:
        0 -35px 2px #8b5cf6,
        0 35px 2px #8b5cf6,
        35px 0 2px #00e5ff,
        -35px 0 2px #00e5ff,
        25px 25px 2px #fff,
        -25px -25px 2px #fff,
        25px -25px 2px #ff4fd8,
        -25px 25px 2px #ff4fd8;
}

.firework:after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:80px;
    height:80px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(
        circle,
        rgba(255,255,255,.2),
        rgba(139,92,246,.12),
        transparent 70%
    );
}

.firework.one{
    left:5%;
    top:15%;
}

.firework.two{
    right:2%;
    top:10%;
    animation-delay:.7s;
}

.firework.three{
    left:45%;
    top:75%;
    animation-delay:1.2s;
}

.firework.four{
    right:15%;
    bottom:0;
    animation-delay:.35s;
}

@keyframes fireworkGlow{

    0%,100%{
        opacity:.25;
        transform:scale(.65);
    }

    50%{
        opacity:1;
        transform:scale(1.15);
        filter:
            drop-shadow(0 0 8px #fff)
            drop-shadow(0 0 18px #8b5cf6);
    }
}


/* =========================
   SPARKS
========================= */

.sparks{
    position:absolute;
    width:4px;
    height:4px;
    background:#fff;
    border-radius:50%;
    box-shadow:0 0 10px #fff;
    z-index:6;
    pointer-events:none;
    animation:sparkMove 2.5s infinite;
}

.spark1{
    left:10%;
    top:70%;
}

.spark2{
    left:80%;
    top:25%;
    animation-delay:.8s;
}

.spark3{
    left:55%;
    top:5%;
    animation-delay:1.5s;
}

@keyframes sparkMove{

    0%{
        opacity:0;
        transform:translate(0,30px) scale(.3);
    }

    25%{
        opacity:1;
    }

    70%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:translate(40px,-50px) scale(1.2);
    }
}


.hero-description{
    max-width:600px;
    color:#9999a5;
    line-height:1.8;
    margin-top:25px;
}

.buttons{
    display:flex;
    gap:15px;
    margin-top:30px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:14px 24px;
    border-radius:50px;
    font-size:14px;
    font-weight:bold;
    transition:.3s;
}

.primary{
    background:linear-gradient(
        135deg,
        #7c3aed,
        #00bfff
    );
}

.outline{
    border:1px solid rgba(255,255,255,.15);
}

.btn:hover{
    transform:translateY(-4px);
}


/* =========================
   PROFILE
========================= */

.profile-area{
    display:flex;
    justify-content:center;
}

.profile-card{
    width:min(390px,100%);
    aspect-ratio:.82;
    border-radius:35px;
    border:1px solid rgba(255,255,255,.1);

    background:
        radial-gradient(
            circle at 30% 20%,
            rgba(139,92,246,.25),
            transparent 40%
        ),
        rgba(255,255,255,.03);

    position:relative;
    overflow:hidden;
    animation:float 5s ease-in-out infinite;
}

.profile-card:before{
    content:"";
    position:absolute;
    inset:-2px;
    background:linear-gradient(
        120deg,
        transparent,
        rgba(139,92,246,.35),
        transparent,
        rgba(0,229,255,.3),
        transparent
    );
    background-size:300% 300%;
    animation:profileGlow 6s linear infinite;
    pointer-events:none;
}

@keyframes profileGlow{
    0%{background-position:0 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0 50%;}
}

.profile-inner{
    position:absolute;
    inset:12px;
    border:1px dashed rgba(255,255,255,.15);
    border-radius:27px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:20px;
    overflow:hidden;
}

.profile-photo{
    width:82%;
    height:82%;
    object-fit:cover;
    object-position:center;
    border-radius:25px;
    border:1px solid rgba(255,255,255,.15);

    box-shadow:
        0 0 30px rgba(139,92,246,.25),
        0 0 70px rgba(0,229,255,.08);

    transition:.5s;
}

.profile-card:hover .profile-photo{
    transform:scale(1.04);
}

.profile-inner strong{
    font-size:22px;
    margin-top:15px;
}

.profile-inner p{
    color:#777783;
    font-size:13px;
    margin-top:8px;
    line-height:1.6;
}

@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }
}


/* =========================
   SECTION TITLES
========================= */

.section-title{
    text-align:center;
    margin-bottom:55px;
}

.section-title span{
    color:#8b5cf6;
    text-transform:uppercase;
    letter-spacing:4px;
    font-size:12px;
}

.section-title h2{
    font-size:clamp(38px,5vw,65px);

}

.section-title p{

}


/* =========================

========================= */

.services{
    display:grid;

    gap:18px;
}

.card{
    padding:30px;
    min-height:260px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:25px;
    background:rgba(255,255,255,.025);

}

.card:hover{

}

.number{

}

.icon{

}

.card h3{
    font-size:21px;

}

.card p{
    color:#777783;

}


/* =========================
   PROJECTS
========================= */

.projects{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.project{
    border-radius:25px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.025);
    transition:.4s;
}

.project:hover{
    transform:translateY(-8px);
    border-color:rgba(139,92,246,.35);
}

.project-image{
    height:240px;

        radial-gradient(
            circle at 70% 70%,
            rgba(0,229,255,.25),
            transparent 35%
        ),
        #111117;

    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.project-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:.6s;
}

.project:hover .project-image img{
    transform:scale(1.07);
}

.project-info{
    padding:25px;
}

.project-info span{
    color:#8b5cf6;
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
}

.project-info h3{
    margin-top:8px;
    font-size:21px;
}

.project-info p{
    color:#777783;
    margin-top:10px;
    line-height:1.6;
    font-size:13px;
}

   ABOUT
========================= */

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;
}

.about-box{
    padding:40px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:30px;
    background:rgba(255,255,255,.025);
}

.about-box h3{
    font-size:32px;
    margin-bottom:20px;
}

.about-box p{
    color:#92929e;
    line-height:1.8;
    margin-bottom:15px;
}

.about-list{
    list-style:none;
    display:grid;
    gap:12px;
}

.about-list li{
    padding:18px;
    border-radius:15px;
    background:rgba(255,255,255,.035);
    color:#9999a5;
}

.about-list strong{
    color:#fff;
}


/* =========================
   SKILLS
========================= */

.skills{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px 50px;
}

.skill-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:14px;
}

.skill-top span:last-child{
    color:#666674;
}

.bar{
    height:7px;
    background:rgba(255,255,255,.07);
    border-radius:20px;
    overflow:hidden;
}

.progress{
    height:100%;
    background:linear-gradient(
        90deg,
        #7c3aed,
        #00d9ff
    );
    border-radius:20px;
}


/* =========================
   CONTACT
========================= */

.contact{
    text-align:center;
    padding:70px 30px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:35px;

    background:
        radial-gradient(
            circle,
            rgba(124,58,237,.15),
            transparent 65%
        ),
        rgba(255,255,255,.025);
}

.contact h2{
    font-size:clamp(40px,6vw,75px);
}

.contact p{
    max-width:600px;
    color:#888894;
    line-height:1.8;
    margin:20px auto 25px;
}

.email{
    display:block;
    font-size:24px;
    font-weight:bold;
    margin-bottom:25px;

        #fff,
        #8b5cf6,
        #00d9ff
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

   WHATSAPP
========================= */

.whatsapp{
    position:fixed;
    left:25px;

footer{

.top{

    background:#15151c;
    color:#fff;

    cursor:pointer;
    z-index:999;

   REVEAL
========================= */

.reveal{
    opacity:0;
    transform:translateY(30px);
    transition:1s;
}

.reveal.show{
    opacity:1;
    transform:translateY(0);
}
